project:
  name: gvpa-region-attribution
  stage: M2
  route: unsupervised_region_validation
  enabled: true

data:
  source_archive: gv.zip
  source_member: gv/recognition/data/gvp/gvpa/GvpA_sequences.json
  dataset_version: gvpa-recognition-c7f6f005d717
  split_version: homology-8b9005e2d9-s42
  random_seed: 42
  canonical_amino_acids_only: true
  homology_clustering:
    tool: mmseqs2
    min_sequence_identity: 0.8
    coverage: 0.8
    coverage_mode: 1
  split_ratios:
    discovery: 0.7
    validation: 0.3

regions:
  coordinate_system: pf00741_hmm_match_state
  window_length: 30
  window_step: 5
  preregistered_candidates:
    - start: 16
      end: 46
      source: reference_thesis
    - start: 25
      end: 55
      source: reference_thesis

features:
  model: facebook/esm2_t12_35M_UR50D
  residue_dimension: 480
  full_length_pooling: residue_mean_without_special_tokens
  window_pooling: residue_mean

clustering:
  fit_split: discovery
  validation_mode: frozen_transform_and_assignment
  pca_dimensions:
    - 20
    - 50
  method: hdbscan
  umap_role: visualization_only

evidence:
  conservation: pf00741_hmm_and_mafft_sensitivity
  structure_primary: pdb_7r1c
  mutation_usage: post_freeze_validation_only
  attribution:
    primary: residue_mask_or_substitution
    attention_role: sequence_dependency_supplement
  random_baseline_required: true

reproducibility:
  deterministic_where_supported: true
  record_input_hashes: true
  record_git_commit: true
  save_failed_runs: true
